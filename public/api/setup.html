<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinematic Flight Studio setup</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#eee9df;background:#07110d;font:15px/1.5 system-ui,sans-serif}main{width:min(480px,100%);padding:36px;border:1px solid #314038}h1{font:400 42px/1 Georgia,serif}label{display:grid;gap:7px;margin:18px 0;color:#bec9bf;font-size:12px;text-transform:uppercase;letter-spacing:.08em}input{min-height:44px;padding:0 10px;color:#eee9df;background:#102019;border:1px solid #56665c}button{width:100%;min-height:46px;margin-top:12px;color:#07110d;background:#eee9df;border:0;font-weight:700}p{color:#aab6ad}#result{margin-top:20px;color:#f3c778}</style></head>
<body><main><h1>Create the Studio owner</h1><p>This works only while the user table is empty. Use the setup token from your private API configuration.</p><form id="setup"><label>Setup token<input name="setupToken" type="password" required></label><label>Name<input name="displayName" value="Studio Owner" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="12" required></label><button>Create owner account</button></form><p id="result" role="status"></p></main><script>document.querySelector('#setup').addEventListener('submit',async(e)=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('index.php?action=setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();document.querySelector('#result').textContent=r.ok?'Owner created. You can now sign in to Studio.':d.error||'Setup failed.';});</script></body></html>
