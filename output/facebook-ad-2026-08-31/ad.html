<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinematic Flight — Facebook ad</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; background: #07110d; }
    body { color: #f5f0e5; font-family: "Avenir Next", Avenir, Futura, sans-serif; }
    .ad { width: 1080px; height: 1350px; overflow: hidden; position: relative; }
    .intro { height: 466px; padding: 35px 64px 0; }
    .identity { height: 134px; display: flex; align-items: flex-start; justify-content: space-between; }
    .logo { width: 360px; height: 120px; object-fit: contain; margin-left: -18px; }
    .audience { margin-top: 37px; text-align: right; font-size: 19px; line-height: 1.5; letter-spacing: 2px; text-transform: uppercase; color: #d0bd94; }
    h1 { margin: 6px 0 0; font-size: 66px; line-height: 1.14; font-weight: 500; letter-spacing: -2.3px; }
    h1 span { color: #dbc18a; }
    .photo { margin: 0; height: 608px; position: relative; }
    .photo img { display: block; width: 1080px; height: 608px; object-fit: cover; }
    figcaption { position: absolute; bottom: 21px; left: 64px; font-size: 16px; line-height: 1.4; letter-spacing: 1px; background: #07110dd9; padding: 8px 12px; }
    .offer { height: 276px; padding: 35px 64px 0; }
    .service { margin: 0; font-size: 34px; line-height: 1.35; font-weight: 500; letter-spacing: -.5px; }
    .service span { display: block; color: #c8c9bd; font-size: 25px; font-weight: 400; letter-spacing: 0; margin-top: 5px; }
    .cta { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #7e704f; margin-top: 29px; padding-top: 23px; color: #dbc18a; font-size: 29px; font-weight: 500; }
    .arrow { font-size: 40px; line-height: 1; font-weight: 400; }
    @media (max-width: 900px) { html { width: 864px; } body { zoom: .8; } }
  </style>
</head>
<body>
  <main class="ad" aria-label="Cinematic Flight Facebook ad">
    <header class="intro">
      <div class="identity">
        <img class="logo" src="../../public/assets/brand/cinematic-flight-logo-concept-v1.png" alt="Cinematic Flight">
        <div class="audience">For resorts, retreats<br>and distinctive stays</div>
      </div>
      <h1>Your property feels<br>different in person.<br><span>Your website should too.</span></h1>
    </header>
    <figure class="photo">
      <img src="../../public/assets/property/good-food-farm-dusk.jpg" alt="The illuminated thatched pavilion at Good Food Farm at dusk">
      <figcaption>Featured property · Good Food Farm</figcaption>
    </figure>
    <footer class="offer">
      <p class="service">We create websites you can enter.<span>A cinematic experience, built from your real photographs.</span></p>
      <div class="cta">Message us for a free photo review <span class="arrow" aria-hidden="true">→</span></div>
    </footer>
  </main>
</body>
</html>
